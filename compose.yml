services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: worth
      POSTGRES_PASSWORD: worth-local-development
      POSTGRES_DB: worth_rust_development
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - worth_rust_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worth -d worth_rust_development"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://worth:worth-local-development@db/worth_rust_development
      BIND_ADDRESS: 0.0.0.0:3001
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
volumes:
  worth_rust_pgdata:
